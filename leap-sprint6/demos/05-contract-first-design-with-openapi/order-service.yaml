openapi: 3.0.3
info:
  title: Order Processing & Settlement Service
  description: >
    Submits orders for validation and execution against a client's portfolio.
    See shared/mission-brief.md for the underlying business rules.
  version: 1.0.0
  license:
    name: Internal use only

servers:
  - url: /v1

paths:
  /orders:
    post:
      summary: Submit an order for processing
      operationId: submitOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            example:
              ticker: AAPL
              instrumentType: EQUITY
              quantity: 100
              price: 150.00
              side: BUY
      responses:
        '201':
          description: Order accepted and executed
          headers:
            Location:
              description: URL of the newly created order
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                id: "42"
                status: ACCEPTED
                fee: 15.0
        '400':
          description: The order failed validation (bad input shape, not a business rule rejection)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid JWT (see Module 9)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            The order was well-formed but rejected by a business rule
            (risk limit, insufficient holding) - see shared/mission-brief.md
            requirement 4
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                id: "43"
                status: REJECTED
                reason: "would exceed the client's risk limit"

components:
  schemas:
    OrderRequest:
      type: object
      required: [ticker, instrumentType, quantity, price, side]
      properties:
        ticker:
          type: string
          example: AAPL
        instrumentType:
          type: string
          enum: [EQUITY, BOND, FUND]
        quantity:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        price:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        side:
          type: string
          enum: [BUY, SELL]

    OrderResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [ACCEPTED, REJECTED]
        fee:
          type: number
          format: double
          nullable: true
          description: Present only when status is ACCEPTED
        reason:
          type: string
          nullable: true
          description: Present only when status is REJECTED

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

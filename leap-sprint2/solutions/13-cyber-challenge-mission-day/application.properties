# VULNERABILITY (A02): the starter exposed every actuator endpoint,
# including env (dumps configuration, potentially secrets) and heapdump,
# with no authentication.
#
# FIX (A02): expose only the endpoints actually needed, and never show raw
# environment values (which may include secrets) through actuator.
management.endpoints.web.exposure.include=health,info
management.endpoint.env.show-values=NEVER

# VULNERABILITY (A02): the starter also returned full stack traces to API
# clients in production.
#
# FIX (A02): never return stack traces or raw exception messages to API
# clients in production.
server.error.include-stacktrace=never
server.error.include-message=never

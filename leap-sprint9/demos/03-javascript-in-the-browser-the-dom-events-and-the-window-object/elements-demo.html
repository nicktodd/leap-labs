<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selecting & Creating Elements</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; max-width: 480px; }
    li.done { text-decoration: line-through; color: #888; }
    button { margin-top: 12px; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>Mission Checklist</h1>
  <ul id="checklist">
    <li class="task">Verify auth service is running</li>
    <li class="task">Confirm Postgres container is healthy</li>
    <li class="task">Check mission service responds to curl</li>
  </ul>
  <button id="add-task">Add Task</button>

  <script src="elements-demo.js"></script>
</body>
</html>

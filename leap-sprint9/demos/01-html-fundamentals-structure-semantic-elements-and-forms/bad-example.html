<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mission Control - Login</title>
</head>
<body>
  <div class="header">
    <div class="title">Mission Control</div>
  </div>
  <div class="content">
    <div class="form">
      <div class="form-title">Log In</div>
      <div class="field">
        <div class="field-label">Username</div>
        <div class="username-box" contenteditable="true"></div>
      </div>
      <div class="field">
        <div class="field-label">Password</div>
        <div class="password-box" contenteditable="true"></div>
      </div>
      <div class="button" onclick="alert('login')">Log In</div>
    </div>
  </div>
  <div class="footer">
    <div>LEAP Mission Control</div>
  </div>
</body>
</html>
